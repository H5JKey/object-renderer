name: C++ checks

on:
  workflow_call:
  push:
    branches: [ "main" ]
    paths:
      - 'renderer/**'
      - '.github/workflows/cpp-checks.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'renderer/**'
      - '.github/workflows/cpp-checks.yml'

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clang-format check
      uses: mrousavy/clang-format-action@v1
      with:
          clang-format-version: '18'
          check-path: 'renderer'
          clang-format-style-path: renderer/.clang-format

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build docker
      run: |
        docker build . --file renderer/Dockerfile --tag renderer --build-arg BUILD_MODE=BOTH --build-arg BUILD_TESTS=ON
    - name: Run tests
      run: |
        docker run --rm --entrypoint /bin/sh renderer -c "cd buivalgrind --leak-check=summary \
         --show-leak-kinds=all \
         --track-origins=yes \
         --error-exitcode=1 ./test"
